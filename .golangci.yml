version: "2"
linters:
  default: none
  enable:
    - dupl
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - revive
    - unparam
    - unused
  settings:
    dupl:
      threshold: 400
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 170
    revive:
      confidence: 0.85
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - zipkin_proto3
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - zipkin_proto3
      - third_party$
      - builtin$
      - examples$
